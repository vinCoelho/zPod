; zPod firmware
;   pio run -e zpod -t upload   -> build and flash the ESP32-S3
;   pio run -e sim -t exec      -> run the desktop simulator (needs SDL2: brew install sdl2)

[platformio]
default_envs = zpod

[env]
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
build_flags =
    -DLGFX_USE_V1

[env:sim]
platform = native
build_type = release
build_src_filter = +<*> -<main_esp32.cpp>
build_flags =
    ${env.build_flags}
    -std=c++17
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2

[env:zpod]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<main_sim.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    ${env.lib_deps}
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.1
